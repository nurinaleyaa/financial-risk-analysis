<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Risk & VaR Analysis Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-bold text-teal-400">Financial Risk Analysis Dashboard</h1>
      <p class="text-slate-400 text-sm mt-1">Value at Risk (VaR) & Portfolio Analytics Engine</p>
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Input Panel -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl space-y-4">
        <h2 class="text-xl font-semibold text-slate-200">Portfolio Parameters</h2>
        
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Portfolio Value (RM)</label>
          <input id="portfolioValue" type="number" placeholder="e.g. 500000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono focus:border-teal-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Confidence Level</label>
            <select id="confidenceLevel" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono focus:border-teal-500 outline-none">
              <option value="" disabled selected>Select...</option>
              <option value="0.90">90%</option>
              <option value="0.95">95%</option>
              <option value="0.99">99%</option>
            </select>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Horizon (Days)</label>
            <input id="horizonDays" type="number" placeholder="e.g. 10" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono focus:border-teal-500 outline-none">
          </div>
        </div>

        <button onclick="calculateRisk()" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold py-2.5 rounded transition duration-200">
          Calculate Risk Metrics
        </button>
      </div>

      <!-- Metrics Output Panel -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-xl space-y-4">
        <h2 class="text-xl font-semibold text-slate-200">Risk Assessment</h2>

        <div class="space-y-3">
          <div class="bg-slate-900 p-3 rounded border border-slate-700/50">
            <span class="text-xs text-slate-400 uppercase">Parametric VaR (RM)</span>
            <p id="varOutput" class="text-2xl font-bold text-rose-400 font-mono">RM 0.00</p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-3 rounded border border-slate-700/50">
              <span class="text-xs text-slate-400 uppercase">Ann. Volatility</span>
              <p id="volatilityOutput" class="text-lg font-bold text-amber-400 font-mono">0.00%</p>
            </div>
            <div class="bg-slate-900 p-3 rounded border border-slate-700/50">
              <span class="text-xs text-slate-400 uppercase">Sharpe Ratio</span>
              <p id="sharpeOutput" class="text-lg font-bold text-emerald-400 font-mono">0.00</p>
            </div>
          </div>

          <div class="bg-slate-900/60 p-3 rounded border border-slate-700/30 text-xs text-slate-300 leading-relaxed" id="interpretationOutput">
            Click "Calculate Risk Metrics" to analyze live market data.
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function calculateRisk() {
      const payload = {
        portfolioValue: Number(document.getElementById('portfolioValue').value),
        confidenceLevel: Number(document.getElementById('confidenceLevel').value),
        horizonDays: Number(document.getElementById('horizonDays').value),
        holdings: [
          { ticker: "AAPL", weight: 0.60, historicalReturns: [0.012, -0.005, 0.008, -0.015, 0.003, 0.011, -0.002] },
          { ticker: "BND", weight: 0.40, historicalReturns: [-0.001, 0.002, -0.001, 0.003, 0.001, -0.002, 0.001] }
        ]
      };

      try {
        const res = await fetch('/api/v1/risk/assess', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.error || res.status >= 400) {
          alert(data.message || 'Error fetching Bursa Malaysia market data.');
          return;
        }

        document.getElementById('varOutput').innerText = `RM ${data.parametricVaR.toLocaleString()}`;
        document.getElementById('volatilityOutput').innerText = `${data.annualizedVolatilityPct}%`;
        document.getElementById('sharpeOutput').innerText = data.sharpeRatio;
        
        const ringgitInterpretation = data.interpretation.replace('$', 'RM ');
        document.getElementById('interpretationOutput').innerText = ringgitInterpretation;
      } catch (err) {
        alert('Error executing risk calculation endpoint.');
      }
    }
  </script>
</body>
</html>
